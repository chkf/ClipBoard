name: iOS build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this version from main after the simulator and device checks pass
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.task }}
    strategy:
      fail-fast: false
      matrix:
        task: [simulator, private-simulator, controls, ipa]
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select Xcode 26
        run: |
          developer_dir="$(python3 -c '
          import pathlib, re
          apps = [(tuple(map(int, m[1].split("."))), p) for p in pathlib.Path("/Applications").glob("Xcode_26*.app") if (m := re.fullmatch(r"Xcode_(26(?:\.\d+)*)\.app", p.name))]
          print(max(apps)[1] / "Contents/Developer")
          ')"
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$developer_dir" xcodebuild -version
      - name: Generate Xcode project
        run: |
          command -v xcodegen || brew install xcodegen
          xcodegen generate
      - name: Simulate SideStore's shared group on the release simulator
        if: matrix.task == 'simulator' && (github.ref_type == 'tag' || inputs.publish)
        run: |
          group='group.net.chkf.Clipboard.SIDETEST01'
          plist=/usr/libexec/PlistBuddy
          "$plist" -c "Set :com.apple.security.application-groups:0 $group" Config/Shared.entitlements
          for file in Config/App.plist Config/Keyboard.plist; do
            "$plist" -c 'Add :ALTAppGroups array' "$file"
            "$plist" -c "Add :ALTAppGroups:0 string $group" "$file"
          done
      - name: Configure independent app and extension containers
        if: matrix.task == 'private-simulator' || matrix.task == 'controls'
        run: |
          plist=/usr/libexec/PlistBuddy
          "$plist" -c 'Delete :com.apple.security.application-groups' Config/Shared.entitlements
          for file in Config/App.plist Config/Keyboard.plist; do
            "$plist" -c 'Add :ClipboardPrivateHistory bool true' "$file"
          done
      - name: Test app and keyboard on iOS 26
        if: matrix.task != 'ipa'
        env:
          CLIPBOARD_TEST_APPEARANCE: ${{ matrix.task == 'private-simulator' && 'dark' || 'light' }}
          CLIPBOARD_TEST_DEVICE: ${{ matrix.task == 'private-simulator' && 'iPhone 17 Pro Max' || 'iPhone 17' }}
          CLIPBOARD_TEST_FOCUS: ${{ matrix.task == 'controls' && 'controls' || 'keyboard' }}
        run: bash scripts/test-ios.sh
      - name: Build and verify device IPA
        if: matrix.task == 'ipa'
        run: |
          version="$(awk '/^    MARKETING_VERSION:/ {print $2}' project.yml)"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          bash scripts/package-ipa.sh "$version"
      - uses: actions/upload-artifact@v4
        if: matrix.task == 'ipa'
        with:
          name: Clipboard-IPA
          path: build/release/
          if-no-files-found: error
      - name: Save test evidence
        if: always() && matrix.task != 'ipa'
        run: |
          if [[ -d build/Tests.xcresult ]]; then
            xcrun xcresulttool get test-results summary --path build/Tests.xcresult || true
            xcrun xcresulttool export attachments --path build/Tests.xcresult --output-path build/screenshots
            ditto -ck --keepParent build/Tests.xcresult build/Tests.xcresult.zip
          fi
      - uses: actions/upload-artifact@v4
        if: always() && matrix.task != 'ipa'
        with:
          name: iOS-test-results-${{ matrix.task }}
          path: |
            build/*.log
            build/Tests.xcresult.zip
            build/screenshots
          if-no-files-found: ignore
          retention-days: 7
  release:
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Clipboard-IPA
          path: release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          sha256sum --check *.sha256
          packages=(Clipboard-*-resign.ipa)
          test "${#packages[@]}" = 1
          version="${packages[0]#Clipboard-}"
          version="${version%-resign.ipa}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "$tag"
          else
            refs="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" --jq '.[].ref')"
            if ! grep -Fxq "refs/tags/$tag" <<< "$refs"; then
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" > /dev/null
            fi
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)" = "$GITHUB_SHA"
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          适用于 iOS 26 及以上版本。用全能签请下载 `-local.ipa`，重签整个 IPA 并保留键盘和控制中心两个扩展。覆盖安装时沿用原包类型和签名标识，可保留键盘历史。

          **连续复制**　在控制中心添加 Clipboard 的「连续复制」，点一下开启画中画，然后回到其他 App 正常复制。小窗可以拖到左右边缘，灵动岛显示计数。关闭小窗、停止收集或锁屏结束本次会话。首次运行请允许粘贴。

          **全能签**　首次结束连拷后，在主 App 打开的 Clipboard 键盘里点「存入键盘」。之后切到键盘时会尝试自动收下近期小条目。大图或尚未送达的记录仍可从主 App 的「连续复制」整批存入。请在系统键盘设置中启用 Clipboard 并打开「允许完全访问」。

          **键盘**　右滑置顶、左滑删除，支持原文和拼音搜索。右侧长退格键与底部数字、Emoji、空格及回车组成操作区。键盘按屏幕宽度调整高度，主 App 齿轮里可微调。共享组或 SideStore 原用户可继续选择 `-resign.ipa` 并保留扩展，连拷结果直接进入共享历史。

          [安装、签名标识与校验说明](https://github.com/chkf/ClipBoard/blob/TAG/README.md)
          NOTES
          sed -i "s|/blob/TAG/|/blob/$tag/|" "$RUNNER_TEMP/release-notes.md"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Clipboard $tag" --notes-file "$RUNNER_TEMP/release-notes.md" *.ipa *.sha256
